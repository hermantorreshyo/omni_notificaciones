# /etc/apache2/sites-available/notificaciones.josepan.app.conf
#
# VirtualHost para el subdominio notificaciones.josepan.app -- Módulo [1007]
# OMNI API CORE v6.9 · JOSEPAN 360 · Debian 13
#
# Sirve: admin/ (Panel de Monitoreo + Administración de Reglas) y
#        assets/js/ (librerías compartidas del widget de campana, para que
#        los demás subsistemas las carguen cross-origin desde aquí).
#
# NO sirve directamente (bloqueado más abajo): database/, cron/, docs/,
# tests/, postman/, y api/ -- ver nota importante al final de este archivo.

<VirtualHost *:80>
    ServerName notificaciones.josepan.app
    DocumentRoot /var/www/omni/omni_notificaciones

    # Redirigir todo a HTTPS una vez el certificado esté instalado (sección 2)
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    ErrorLog ${APACHE_LOG_DIR}/notificaciones_error.log
    CustomLog ${APACHE_LOG_DIR}/notificaciones_access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName notificaciones.josepan.app
    DocumentRoot /var/www/omni/omni_notificaciones

    <Directory /var/www/omni/omni_notificaciones>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # --- Carpetas que NUNCA deben ser accesibles vía HTTP ---
    # api/ incluido a propósito: NotificationController.php y
    # NotificationRulesController.php son controllers de negocio pensados
    # para integrarse al router de OMNI API CORE (comparten su conexión PDO
    # y su verificación JWT) -- no son un proxy standalone y no deben
    # ejecutarse expuestos directamente en este dominio.
    <DirectoryMatch "^/var/www/omni/omni_notificaciones/(database|cron|docs|tests|postman|api)">
        Require all denied
    </DirectoryMatch>

    <FilesMatch "\.(sql|md|log)$">
        Require all denied
    </FilesMatch>

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/notificaciones.josepan.app/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/notificaciones.josepan.app/privkey.pem

    ErrorLog ${APACHE_LOG_DIR}/notificaciones_error.log
    CustomLog ${APACHE_LOG_DIR}/notificaciones_access.log combined
</VirtualHost>
</IfModule>
