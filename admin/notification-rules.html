<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Reglas Programadas · OMNI Admin</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F7F3EE; margin: 0; padding: 24px; color: #2a2a2a; }
  h1 { font-family: 'Cormorant Garamond', serif; color: #642a72; font-size: 28px; margin: 0 0 20px; }
  .form-card { background: #fff; border-radius: 12px; padding: 18px; margin-bottom: 20px; max-width: 560px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .form-card label { display: block; font-size: 12px; color: #6b6b6b; margin: 10px 0 4px; }
  .form-card input, .form-card select { width: 100%; min-height: 40px; padding: 6px 10px; border-radius: 8px; border: 1px solid #d9d2c7; box-sizing: border-box; }
  .form-card button { min-height: 46px; margin-top: 14px; background: #642a72; color: #fff; border: none; border-radius: 8px; padding: 0 18px; cursor: pointer; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 12px; font-size: 13px; border-bottom: 1px solid #f0ece5; }
  th { background: #F7F3EE; color: #642a72; }
  .btn-delete { min-height: 40px; min-width: 40px; background: #c0392b; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  .error-msg { color: #c0392b; font-size: 13px; margin-top: 8px; }
  .hidden { display: none; }
</style>
</head>
<body>
  <h1>Administración de Reglas Programadas</h1>

  <div class="form-card">
    <div class="error-msg hidden" id="form-error"></div>
    <label>Nombre</label>
    <input type="text" id="f-name" placeholder="Ej. Traspaso diario no registrado">

    <label>Tipo de notificación</label>
    <select id="f-notification-type"></select>

    <label>Patrón de condición</label>
    <select id="f-rule-type"></select>

    <label>Hora de evaluación</label>
    <input type="time" id="f-check-time" step="1" value="09:00:00">

    <label>Alcance</label>
    <select id="f-scope">
      <option value="all_pos">Todas las sedes</option>
      <option value="specific_interlocutor">Una sede específica</option>
      <option value="hierarchy_level">Nivel jerárquico (resumen consolidado)</option>
    </select>

    <div id="wrap-interlocutor" class="hidden">
      <label>ID de la sede</label>
      <input type="number" id="f-interlocutor-id">
    </div>

    <div id="wrap-hierarchy" class="hidden">
      <label>Nivel jerárquico</label>
      <select id="f-hierarchy-level"></select>
    </div>

    <button id="btn-save">Crear regla</button>
  </div>

  <table>
    <thead>
      <tr><th>Nombre</th><th>Tipo</th><th>Hora</th><th>Alcance</th><th>Activa</th><th>Últ. 30d</th><th></th></tr>
    </thead>
    <tbody id="rules-table-body"></tbody>
  </table>

  <script src="/assets/js/api-client.js"></script>
  <script src="/assets/js/notification-rules-admin.js"></script>
</body>
</html>
